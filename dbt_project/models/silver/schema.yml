version: 2

models:
  - name: silver_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: silver_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: silver_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - relationships:
              to: ref('silver_customers')
              field: customer_id

  - name: silver_order_items
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - relationships:
              to: ref('silver_orders')
              field: order_id
